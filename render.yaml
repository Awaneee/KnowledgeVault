# Render Blueprint — provisions the Web Service, Postgres and Redis
# (Key Value) in one shot instead of three manual dashboard steps.
#
# Usage:
#   1. Push this file to the repo root.
#   2. Render dashboard -> New -> Blueprint -> pick this repo.
#   3. Render reads this file and shows you everything it's about to create.
#      Confirm, and it provisions all three services together.
#   4. Fill in the `sync: false` secret env vars in the dashboard after
#      creation — their values are deliberately NOT stored in this file.
#   5. Connect to the new Postgres instance once and run:
#         CREATE EXTENSION IF NOT EXISTS vector;
#      before the first deploy's migrations run (see repo notes in
#      study/resume.md / study/redis.md for why).

databases:
  - name: knowledgevault-db
    databaseName: knowledgevault
    plan: free
    postgresMajorVersion: "16"   # matches pgvector/pg16 used in docker-compose.yml and CI

services:
  # --- Redis-compatible cache/queue (Render calls this "Key Value") -------
  - type: keyvalue
    name: knowledgevault-redis
    plan: free
    ipAllowList: []   # only reachable from other services in this workspace

  # --- API + in-process worker (same container, same pattern as Railway) --
  - type: web
    name: knowledgevault-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/
    # Overrides the Dockerfile's CMD so migrations run before the server
    # starts, same as railway.toml's startCommand.
    # An inline "cmd1 && cmd2" string here does not reliably survive
    # Render's parsing (tried plain, tried wrapped in sh -c — both failed
    # differently). A script file sidesteps the quoting/splitting entirely.
    dockerCommand: sh render-start.sh
    envVars:
      # --- Wired automatically from the resources above -------------------
      - key: DATABASE_URL
        fromDatabase:
          name: knowledgevault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: knowledgevault-redis
          property: connectionString

      # --- Set once you know the deployed URL (Step 6 in the checklist) ---
      - key: APP_BASE_URL
        sync: false

      # --- Copy these values from Railway's Variables tab ------------------
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        sync: false

      - key: LLM_PROVIDER
        sync: false
      - key: LLM_PROVIDER_PRIORITY
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_INTENT_MODEL
        sync: false
      - key: GEMINI_ANSWER_MODEL
        sync: false

      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_API_BASE
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_APP_NAME
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        sync: false
      - key: EMAIL_FROM
        sync: false
