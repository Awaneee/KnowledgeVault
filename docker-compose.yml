name: knowledgevault

x-app-image: &app-image knowledgevault-backend:local
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kv_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: *app-image
    container_name: kv_migrate
    env_file: .env
    environment:
      <<: *app-env
    command: >
      sh -c "
        echo 'Waiting 15 seconds for postgres...' &&
        sleep 15 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Migrations complete.'
      "
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv_api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads

  worker:
    image: *app-image
    container_name: kv_worker
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    command: python -m app.workers.note_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
