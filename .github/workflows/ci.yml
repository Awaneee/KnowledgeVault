name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same value the test suite sets in tests/conftest.py (>= 32 chars).
  JWT_SECRET: ci-only-jwt-secret-that-is-32-chars-xx

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # Settings() needs a URL to instantiate; the unit tests never connect.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch, as in the Dockerfile)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # same image as docker-compose
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Exactly one Alembic head
        run: |
          heads=$(alembic heads | grep -c "(head)")
          echo "heads: $heads"
          test "$heads" -eq 1

      - name: Apply all migrations to an empty database
        run: alembic upgrade head
